[package]
name = "eq"
version = "0.2.0"
edition = "2024"
description = "System-wide parametric equalizer for macOS"
license = "GPL-3.0-only"
repository = "https://github.com/dylenq/macos-parametric-eq"
readme = "README.md"
keywords = ["equalizer", "parametric-eq", "macos", "audio", "core-audio"]
categories = ["multimedia::audio"]

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
muda = "0.21.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace", "objc2-core-foundation"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
rfd = { version = "0.17.2", default-features = false }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
